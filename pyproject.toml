[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reconpro"
version = "11.2.0"
description = "ReconPro v11 — Enterprise Security Reconnaissance Platform. 28 Modules. 81 Commands. MITRE ATT&CK. JSON/SARIF/Markdown/HTML Reports. Pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ReconPro Security", email = "security@reconpro.io" },
]
keywords = [
    "security",
    "scanner",
    "reconnaissance",
    "vulnerability",
    "pentest",
    "osint",
    "subdomain",
    "mitre-attack",
    "sarif",
    "fuzzer",
    "waf-bypass",
    "grpc",
    "lfi",
    "rfi",
    "timing-attack",
    "webhook",
    "plugin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0.0",
    "textual>=0.40.0",
    "requests>=2.28.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
async = ["aiohttp>=3.9.0"]
browser = ["playwright>=1.40.0"]
llm = ["openai>=1.0.0", "anthropic>=0.18.0"]
graph = ["networkx>=3.0"]
raw = ["scapy>=2.7.0"]
intel = ["shodan>=1.25.0"]
collab = ["websockets>=12.0"]
integrations = ["jira>=3.0", "slack-sdk>=3.0"]
full = [
    "aiohttp>=3.9.0",
    "playwright>=1.40.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "networkx>=3.0",
    "scapy>=2.7.0",
    "shodan>=1.25.0",
    "websockets>=12.0",
]

[project.scripts]
reconpro = "reconpro.cli:main"

[project.urls]
Homepage = "https://github.com/falconxa0-commits/reconpro"
Documentation = "https://github.com/falconxa0-commits/reconpro/tree/main/docs"
Repository = "https://github.com/falconxa0-commits/reconpro"
Issues = "https://github.com/falconxa0-commits/reconpro/issues"
Changelog = "https://github.com/falconxa0-commits/reconpro/releases"

[tool.setuptools]
packages = [
    "reconpro",
    "reconpro.modules",
    "reconpro.integrations",
    "reconpro.widgets",
    "reconpro.plugin_sdk",
    "reconpro.tests",
]
include-package-data = true

[tool.setuptools.package-data]
reconpro = ["scripts/*.py"]
