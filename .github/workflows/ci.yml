# ReconPro CI — push/PR gate.
# NOTE on chunking: the FULL test suite in one pytest invocation hangs in
# this repo (known issue). Tests therefore run in explicit chunks defined
# in tools/ci_test_groups.txt via tools/run_test_chunks.sh, each chunk with
# its own hard timeout. Files that currently fail/timeout are listed at the
# bottom of the groups file with reasons — do NOT merge them back blindly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install ruff

      - name: Lint (ruff — pyproject has no [tool.ruff] section, so fatal-error selection)
        run: |
          # E9/F63: syntax & fatal errors. A stricter rule set should be
          # introduced via [tool.ruff] in pyproject.toml as debt is paid down
          # (7 pre-existing F821 hits live in entropy.py dead code today).
          ruff check reconpro --select E9,F63

      - name: Run tests in chunks (avoids known full-suite hang)
        run: |
          bash tools/run_test_chunks.sh

      - name: Startup benchmark gate (median cold start must be <= 100 ms)
        run: |
          # Honest target. The lazy-import performance work is tracked
          # separately; until it lands this gate is red on purpose.
          python tools/bench_startup.py --threshold-ms 100 --json-out bench_startup.json

      - name: Security AST scan (fail on NEW findings vs baseline)
        run: |
          python tools/security_scan.py \
            --baseline-file tools/security_baseline.json \
            --sarif-out security_scan.sarif

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ matrix.python-version }}
          path: |
            bench_startup.json
            security_scan.sarif
          if-no-files-found: ignore
